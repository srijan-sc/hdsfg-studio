[project]
name = "hdsfg-studio"
version = "0.2.0"
description = "Desktop app for heterodyne-detected SFG retrieval (v37b pipeline), FVB spectra and full-chip images"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.3",
    "pyqtgraph==0.14.0",
    "PySide6==6.11.2",
    "scipy==1.18.1",
]

[project.urls]
Source = "https://github.com/srijan-sc/hdsfg-studio"

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.gui-scripts]
hdsfg-studio = "hdsfg_studio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hdsfg_engine", "hdsfg_studio"]
